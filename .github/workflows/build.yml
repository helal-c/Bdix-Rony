name: Build

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository manifest
        run: python - <<'PY'
import json
with open("builds/repo.json", encoding="utf-8") as f:
    data = json.load(f)
assert data["name"] == "Bdix-Rony"
assert len(data["providers"]) == 37
print("Manifest OK:", len(data["providers"]), "providers")
PY
