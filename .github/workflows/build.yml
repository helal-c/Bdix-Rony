name: Build

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate repository manifest
        run: python - <<'PY'
import json
with open("builds/repo.json", encoding="utf-8") as f:
    data = json.load(f)
assert data["name"] == "Bdix-Rony"
assert len(data["providers"]) == 37
print("Manifest OK:", len(data["providers"]), "providers")
PY

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Build with Gradle
        run: ./gradlew build --no-daemon
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: provider-jars
          path: providers/*/build/libs/*.jar
          retention-days: 7
